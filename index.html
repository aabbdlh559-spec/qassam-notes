<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Qassam Notes - ملاحظات القسام</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1e293b">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col">
    <header class="bg-slate-800 border-b border-slate-700 p-4 shadow-md flex justify-between items-center">
        <h1 class="text-xl font-bold text-emerald-400">📝 ملاحظات القسام (Qassam Notes)</h1>
        <span class="text-xs bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 px-2 py-1 rounded-full">نسخة الويب</span>
    </header>

    <main class="flex-1 max-w-2xl w-full mx-auto p-4 flex flex-col gap-4">
        <div class="bg-slate-800 border border-slate-700 rounded-xl p-4 shadow-lg flex flex-col gap-3">
            <input type="text" id="noteTitle" placeholder="عنوان الملاحظة..." class="bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-emerald-500">
            <textarea id="noteContent" rows="3" placeholder="اكتب تفاصيل الملاحظة هنا..." class="bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-emerald-500 resize-none"></textarea>
            <button onclick="saveNote()" class="bg-emerald-600 hover:bg-emerald-500 text-white font-medium py-2 rounded-lg transition text-sm shadow">حفظ الملاحظة</button>
        </div>

        <div class="flex flex-col gap-3" id="notesList">
            <!-- سيتم إضافة الملاحظات هنا ديناميكياً -->
        </div>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', renderNotes);

        function saveNote() {
            const title = document.getElementById('noteTitle').value.trim();
            const content = document.getElementById('noteContent').value.trim();
            if(!title && !content) return;

            const notes = JSON.parse(localStorage.getItem('qassam_notes') || '[]');
            notes.unshift({ id: Date.now(), title, content, date: new Date().toLocaleDateString('ar-SA') });
            localStorage.setItem('qassam_notes', JSON.stringify(notes));

            document.getElementById('noteTitle').value = '';
            document.getElementById('noteContent').value = '';
            renderNotes();
        }

        function deleteNote(id) {
            let notes = JSON.parse(localStorage.getItem('qassam_notes') || '[]');
            notes = notes.filter(n => n.id !== id);
            localStorage.setItem('qassam_notes', JSON.stringify(notes));
            renderNotes();
        }

        function renderNotes() {
            const container = document.getElementById('notesList');
            const notes = JSON.parse(localStorage.getItem('qassam_notes') || '[]');
            
            if(notes.length === 0) {
                container.innerHTML = '<p class="text-center text-slate-500 text-sm py-8">لا توجد ملاحظات محفوظة حالياً.</p>';
                return;
            }

            container.innerHTML = notes.map(n => `
                <div class="bg-slate-800 border border-slate-700 rounded-xl p-4 shadow flex justify-between items-start gap-4">
                    <div class="flex-1">
                        <h3 class="font-bold text-emerald-300 text-base mb-1">${n.title || 'بدون عنوان'}</h3>
                        <p class="text-slate-300 text-sm whitespace-pre-wrap mb-2">${n.content}</p>
                        <span class="text-xs text-slate-500">${n.date}</span>
                    </div>
                    <button onclick="deleteNote(${n.id})" class="text-rose-400 hover:text-rose-300 text-xs px-2 py-1 bg-rose-500/10 rounded border border-rose-500/20">حذف</button>
                </div>
            `).join('');
        }
    </script>
</body>
</html>
